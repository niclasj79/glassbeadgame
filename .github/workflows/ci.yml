name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    # The browser suite on GitHub's runner takes 5 to 8 minutes; a slow
    # Chromium download once took 9 on its own and cancelled a passing run at
    # the old limit of 15. The cache below makes that download the exception.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Steering harness tests
        run: npm run steering:test
      - name: Validate steering state
        run: npm run steering:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate content
        run: npm run validate:content
      - name: Production build
        run: npm run build
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -e "process.stdout.write(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser smoke
        run: npm run test:browser
      - name: Bundle budget
        run: npm run bundle:check
