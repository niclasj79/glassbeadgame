    <title>The Glass Bead Game</title>
    <!--
      The share copy names what the Game actually contains. It used to advertise
      "six disciplines" and list mathematics, music, philosophy, physics, art and
      history — a different product from the one that ships. Castalia has four
      faculties (src/content/castalia/faculties.ts): Measure, Sound, Matter and
      Image. Anyone arriving from a link must find the game the link described.
    -->
    <meta
      name="description"
      content="A contemplative game of connections — weave luminous threads between ideas across four faculties: Measure, Sound, Matter and Image. After Hermann Hesse's Das Glasperlenspiel."
    />
    <meta name="theme-color" content="#06090f" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
